org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true

# Opt into Dokka V2 to silence the V1 deprecation warning.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

android.useAndroidX=true
android.nonTransitiveRClass=true

GROUP=xyz.ksharma
VERSION_NAME=0.1.0-SNAPSHOT

POM_NAME=Dhruva
POM_DESCRIPTION=Kotlin Multiplatform location library for Android and iOS. Single-shot and continuous tracking, FusedLocationProvider on Android, CLLocationManager on iOS.
