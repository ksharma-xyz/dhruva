name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (gradlew build - assemble, tests, lint, detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # One `build` rather than a hand-maintained list of tasks. `build` is what a
      # contributor runs locally, so CI and local agree by construction instead of
      # by remembering to keep two lists in sync. That drift is not hypothetical:
      # lint was missing here, which let a manifest error ship a valid APK that
      # crashed on launch, twice, in the sibling aagya repo (ksharma-xyz/aagya#6).
      #
      # This covers assemble (both sample APK variants), lint, detekt, and the JVM
      # and Android unit tests. Gradle names the failing task on failure, and the
      # reports artifact below carries the detail.
      - name: Build, test, lint, detekt
        id: build
        run: ./gradlew build --stacktrace

      # Kover's report task depends on the same test tasks `build` just ran, so those are
      # UP-TO-DATE here and this only does the merge - coverage costs a report, not a second
      # test run. Only reached when the build passed: partial coverage from a broken run is
      # worse than none.
      - name: Generate coverage report
        id: coverage
        run: ./gradlew koverXmlReport koverHtmlReport --stacktrace

      - name: Upload coverage report (HTML)
        if: always() && steps.coverage.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: build/reports/kover/html/**
          if-no-files-found: warn
          retention-days: 7

      # Best-effort: a missing token or a Codecov outage must not fail a PR. The `host-tests`
      # flag records what this number actually measures - Kover is JVM-only, so the iOS
      # actuals are absent from it by construction, not by omission.
      - name: Upload coverage to Codecov
        if: always() && steps.coverage.conclusion == 'success'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          flags: host-tests
          fail_ci_if_error: false

      - name: Upload sample APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sample-android-debug-apk
          path: sample-android/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-android
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  build-ios:
    name: Build iOS (Kotlin tests, sample app, publish dry-run)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native Konan dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Unit tests (iOS Simulator arm64)
        run: ./gradlew iosSimulatorArm64Test --stacktrace

      - name: Build sample iOS app (Simulator)
        # Compiles the SwiftUI host AND embeds the Compose framework via the
        # gradle build phase. Catches mistakes that linkDebugFrameworkIosSimulatorArm64
        # would miss: pbxproj errors, missing Info.plist keys (e.g.
        # CADisableMinimumFrameDurationOnPhone), Swift name mismatches against
        # the generated framework header, etc.
        run: |
          xcodebuild \
            -project sample-ios/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/dhruva-sample-derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Verify Maven publication (dry run, local repo only)
        # Requires macOS so all KMP targets (Android + iOS) compile in one place
        # before the artifacts are assembled into a publication.
        run: ./gradlew publishToMavenLocal --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: "false"

      - name: Upload sample iOS .app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sample-ios-debug-app
          path: /tmp/dhruva-sample-derived/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-ios
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  docs-build:
    name: Verify MkDocs site builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: |
          pip install \
            mkdocs-material \
            mkdocs-minify-plugin \
            "pymdown-extensions>=10"

      - name: Build site (strict mode catches broken links and missing pages)
        run: mkdocs build --strict
